apiVersion: v1
kind: Pod
metadata:
  name: crash-demo
  namespace: ai
  labels:
    app: crash-demo
spec:
  containers:
    - name: crash-demo
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting crash demo application"
          echo "Connecting to database..."
          echo "ERROR: failed to connect to database at db.ai.svc:5432"
          echo "Reason: connection refused"
          sleep 5
          exit 1
  restartPolicy: Always
