apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-incident-summarizer-sa
  namespace: ai

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-incident-summarizer-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-incident-summarizer-reader
subjects:
  - kind: ServiceAccount
    name: ai-incident-summarizer-sa
    namespace: ai
roleRef:
  kind: ClusterRole
  name: ai-incident-summarizer-reader
  apiGroup: rbac.authorization.k8s.io
